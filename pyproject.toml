[project]
name = "rumik-fast"
version = "0.1.0"
description = "Real-time rumik-oss-1 TTS on a 4 GB laptop GPU: int4 CUDA/Triton kernels, streaming Mimi, web UI"
readme = "README.md"
requires-python = ">=3.12"
# Versions tested on the RTX 3050 Laptop (torch 2.14.1 from PyPI = a CUDA 13 build; it brings triton 3.8).
# The CUDA GEMV is compiled on first use (torch.utils.cpp_extension): needs nvcc from the CUDA toolkit.
dependencies = [
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "ninja>=1.11",
]

[project.optional-dependencies]
live = ["sounddevice>=0.5.6"]      # engine/speak.py (playback through PortAudio)
modal = ["modal"]                   # the modal_*.py cloud scripts (steps 1-3)

[tool.uv]
package = false
# uv.lock pins exactly the versions tested on the RTX 3050 Laptop (from the working venv)
constraint-dependencies = [
    "cuda-bindings==13.4.4",
    "cuda-pathfinder==1.8.4",
    "cuda-toolkit==13.0.3.0",
    "huggingface-hub==2.3.0",
    "numpy==2.5.4",
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cudnn-cu13==9.24.0.43",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufile==1.15.1.6",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparselt-cu13==0.8.1",
    "nvidia-nccl-cu13==2.30.7",
    "nvidia-nvjitlink==13.4.92",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.0.85",
    "safetensors==0.8.0",
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.21.0",
    "triton==3.8.0",
]
